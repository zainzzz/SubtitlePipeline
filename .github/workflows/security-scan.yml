# Security scan — runs pip-audit on Python deps and Trivy on Docker images.
# Triggers on PRs to main, pushes to main, and weekly schedule.
name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit CPU requirements
        run: pip-audit -r backend/requirements.txt

      - name: Audit GPU requirements
        run: pip-audit -r backend/requirements-gpu.txt
        continue-on-error: true  # GPU-only deps (torch+cu126) may not resolve on CPU runner

  trivy:
    name: Trivy (Docker image scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CPU image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          tags: subtitlepipeline:scan
          load: true
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: subtitlepipeline:scan
          format: table
          exit-code: "0"  # info-only for now; switch to "1" to fail on HIGH/CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
