services:
  subpipeline:
    image: saaak/subtitlepipeline:latest-gpu
    container_name: subtitlepipeline-gpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SUBPIPELINE_PORT: "8000"
      SUBPIPELINE_DB_PATH: /config/subpipeline.db
      SUBPIPELINE_FRONTEND_DIST: /app/frontend/dist
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
      # HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ./data:/data
      - ./output:/output
      - ./models:/models
      - ./config:/config
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
