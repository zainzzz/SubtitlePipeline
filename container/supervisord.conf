[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=app
# Wait up to 30s for child processes to exit on SIGTERM before SIGKILL.
# This gives the scanner/worker time to finish the current scan/task.
stopsignal=TERM
stopwaitsecs=30
# Kill all children in the same process group on exit.
killasgroup=true
stopasgroup=true

[program:api]
directory=/app/backend
command=python3 -m app.api_server
user=app
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scanner]
directory=/app/backend
command=python3 -m app.scanner_process
user=app
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/app/backend
command=python3 -m app.worker_process
user=app
autostart=true
autorestart=true
priority=30
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
